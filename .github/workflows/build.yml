name: AlphaStudio C++20 & ASIO SDK 2.3.4 Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (${{ matrix.arch }}) + Steinberg ASIO SDK 2.3.4
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (${{ matrix.arch }})
        run: cmake -S . -B build-${{ matrix.arch }} -A ${{ matrix.cmake_arch }}

      - name: Build AlphaStudio & AlphaVstBridge32 (Release)
        run: cmake --build build-${{ matrix.arch }} --config Release --parallel

      - name: Run End-to-End Verification Suite
        run: |
          .\build-${{ matrix.arch }}\AlphaStudio\Release\AlphaStudio.exe --verify
          .\build-${{ matrix.arch }}\AlphaStudio\Release\AlphaVstBridge32.exe --self-test

      - name: Upload Windows (${{ matrix.arch }}) Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AlphaStudio-Windows-${{ matrix.arch }}
          path: |
            build-${{ matrix.arch }}/AlphaStudio/Release/AlphaStudio.exe
            build-${{ matrix.arch }}/AlphaStudio/Release/AlphaVstBridge32.exe

  build-linux:
    name: Linux (x86_64) + Steinberg ASIO SDK 2.3.4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release)
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build AlphaStudio & AlphaVstBridge32
        run: cmake --build build-linux --parallel

      - name: Run End-to-End Verification Suite
        run: |
          ./build-linux/AlphaStudio/AlphaStudio --verify
          ./build-linux/AlphaStudio/AlphaVstBridge32 --self-test

      - name: Upload Linux (x86_64) Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AlphaStudio-Linux-x86_64
          path: |
            build-linux/AlphaStudio/AlphaStudio
            build-linux/AlphaStudio/AlphaVstBridge32

  build-macos:
    name: macOS + Steinberg ASIO SDK 2.3.4
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release)
        run: cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release

      - name: Build AlphaStudio & AlphaVstBridge32
        run: cmake --build build-macos --parallel

      - name: Run End-to-End Verification Suite
        run: |
          ./build-macos/AlphaStudio/AlphaStudio --verify
          ./build-macos/AlphaStudio/AlphaVstBridge32 --self-test

      - name: Upload macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: AlphaStudio-macOS
          path: |
            build-macos/AlphaStudio/AlphaStudio
            build-macos/AlphaStudio/AlphaVstBridge32
